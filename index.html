
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff7900">
<title>Hepx_no | Food Delivery</title>

<style>
:root {
  --orange: #ff7900;
  --orange-dark: #e96b00;
  --orange-light: #fff0e2;
  --white: #ffffff;
  --bg: #fafafa;
  --text: #202020;
  --muted: #858585;
  --border: #eeeeee;
  --green: #159b62;
  --radius: 18px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #eeeeee;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }

#app {
  width: 100%;
  max-width: 480px;
  min-height: 100dvh;
  margin: auto;
  background: var(--bg);
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 35px #0000000b;
}
.screen { min-height: 100dvh; }
.hidden { display: none !important; }

.topbar {
  background: white;
  padding: 19px 18px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 5;
  border-bottom: 1px solid var(--border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
  font-size: 21px;
  letter-spacing: -.7px;
}
.logo {
  width: 42px;
  height: 42px;
  background: var(--orange);
  color: white;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 23px;
}
.brand span { color: var(--orange); }
.location {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.icon-btn {
  width: 43px;
  height: 43px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 14px;
  position: relative;
  font-size: 19px;
}
.cart-count {
  position: absolute;
  right: -5px;
  top: -5px;
  background: var(--orange);
  color: white;
  font-size: 11px;
  border-radius: 50%;
  min-width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
}
.page {
  padding: 19px 17px 105px;
  min-height: calc(100dvh - 75px);
}
h1 { font-size: 27px; margin: 0 0 9px; line-height: 1.2; }
h2 { font-size: 19px; margin: 0; }
h3 { font-size: 15px; margin: 0; }
p { line-height: 1.5; }
.muted { color: var(--muted); font-size: 13px; }
.orange { color: var(--orange); }
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 25px 0 14px;
}
.text-btn {
  background: none;
  border: 0;
  color: var(--orange-dark);
  font-weight: 700;
  font-size: 12px;
}
.search {
  display: flex;
  gap: 9px;
  margin: 20px 0;
}
.search input {
  width: 100%;
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 14px;
  outline: none;
}
.search input:focus, .field input:focus {
  border-color: var(--orange);
}
.search button {
  width: 49px;
  flex-shrink: 0;
  border: 0;
  background: var(--orange);
  color: white;
  border-radius: 14px;
  font-size: 19px;
}
.banner {
  background: linear-gradient(120deg, #ff7900, #ff9f43);
  color: white;
  border-radius: 22px;
  padding: 24px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 160px;
  overflow: hidden;
}
.banner h2 { font-size: 25px; line-height: 1.2; }
.banner p { font-size: 12px; margin: 9px 0 15px; }
.banner-art { font-size: 72px; flex-shrink: 0; }
.pill-btn {
  background: white;
  color: var(--orange-dark);
  border: 0;
  padding: 11px 16px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 800;
}
.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 2px 0 8px;
  scrollbar-width: none;
}
.categories::-webkit-scrollbar { display: none; }
.category {
  border: 1px solid var(--border);
  background: white;
  padding: 11px 16px;
  border-radius: 25px;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 700;
}
.category.active {
  background: var(--orange);
  color: white;
  border-color: var(--orange);
}
.food-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}
.food-card {
  min-width: 0;
  border: 1px solid var(--border);
  background: white;
  border-radius: var(--radius);
  overflow: hidden;
}
.food-image {
  background: var(--orange-light);
  height: 128px;
  display: grid;
  place-items: center;
  font-size: 67px;
  position: relative;
}
.food-image .tag {
  position: absolute;
  top: 9px;
  left: 9px;
  background: white;
  color: var(--orange-dark);
  padding: 5px 7px;
  border-radius: 7px;
  font-size: 9px;
  font-weight: 800;
}
.food-info { padding: 12px; }
.food-info h3 { line-height: 1.4; min-height: 35px; }
.food-desc {
  color: var(--muted);
  font-size: 11px;
  margin: 5px 0 12px;
}
.food-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}
.price { font-size: 14px; font-weight: 800; }
.add-btn {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 11px;
  background: var(--orange);
  color: white;
  font-size: 23px;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: white;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 9px 5px max(10px, env(safe-area-inset-bottom));
  z-index: 10;
}
.nav-btn {
  background: none;
  border: 0;
  color: #999;
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 5px 0;
}
.nav-icon { font-size: 21px; }
.nav-btn.active { color: var(--orange); font-weight: 800; }

.primary {
  width: 100%;
  border: 0;
  padding: 15px;
  border-radius: 14px;
  color: white;
  background: var(--orange);
  font-weight: 800;
}
.primary:active, .add-btn:active { transform: scale(.98); }
.secondary {
  width: 100%;
  background: white;
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 13px;
  font-weight: 700;
}
.field { margin: 15px 0; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}
.field input, .field select {
  width: 100%;
  border: 1px solid #e5e5e5;
  background: white;
  padding: 14px;
  border-radius: 12px;
  outline: none;
}
.auth-wrap {
  min-height: 100dvh;
  padding: 35px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: white;
}
.auth-logo {
  width: 76px;
  height: 76px;
  border-radius: 25px;
  font-size: 39px;
  margin-bottom: 25px;
}
.auth-wrap h1 { font-size: 30px; }
.auth-switch {
  text-align: center;
  font-size: 13px;
  margin-top: 20px;
}
.link-btn {
  background: none;
  border: none;
  color: var(--orange-dark);
  font-weight: 800;
}
.panel {
  background: white;
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 17px;
  margin-bottom: 13px;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.divider {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 14px 0;
}
.cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 15px 0;
}
.cart-emoji {
  width: 61px;
  height: 61px;
  display: grid;
  place-items: center;
  background: var(--orange-light);
  border-radius: 14px;
  font-size: 31px;
  flex-shrink: 0;
}
.qty {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 9px;
}
.qty button {
  background: var(--orange-light);
  color: var(--orange-dark);
  border: 0;
  width: 27px;
  height: 27px;
  border-radius: 8px;
  font-weight: 800;
}
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-info h3 { margin-bottom: 6px; }
.total-line {
  display: flex;
  justify-content: space-between;
  margin: 13px 0;
  font-size: 13px;
}
.total-line.final { font-weight: 900; font-size: 17px; }
.empty {
  text-align: center;
  padding: 55px 20px;
}
.empty-icon { font-size: 64px; margin-bottom: 18px; }
.profile-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 8px 0 24px;
}
.avatar {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: var(--orange-light);
  color: var(--orange-dark);
  display: grid;
  place-items: center;
  font-size: 25px;
  font-weight: 900;
}
.menu-row {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
  width: 100%;
  background: white;
  border-top: 0;
  border-left: 0;
  border-right: 0;
  text-align: left;
}
.menu-row:last-child { border-bottom: 0; }
.menu-icon {
  background: var(--orange-light);
  width: 41px;
  height: 41px;
  display: grid;
  place-items: center;
  border-radius: 12px;
}
.menu-arrow { margin-left: auto; color: #aaa; }
.status {
  color: var(--green);
  font-size: 11px;
  font-weight: 800;
  background: #e8f8f0;
  border-radius: 20px;
  padding: 7px 10px;
}
.notice {
  font-size: 12px;
  padding: 12px;
  border-radius: 12px;
  background: var(--orange-light);
  color: #9c4c00;
  line-height: 1.5;
}
.toast {
  position: fixed;
  bottom: 92px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: white;
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 12px;
  z-index: 30;
  width: max-content;
  max-width: 90%;
  box-shadow: 0 5px 20px #0002;
}
.small { font-size: 11px; }
@media (min-width: 481px) {
  body { padding: 12px 0; }
  #app { border-radius: 23px; min-height: calc(100dvh - 24px); }
  .bottom-nav { bottom: 12px; border-radius: 0 0 23px 23px; }
}
</style>
</head>

<body>
<div id="app">

  <!-- LOGIN AND SIGNUP -->
  <section id="authScreen" class="screen">
    <div class="auth-wrap">
      <div class="logo auth-logo">H</div>
      <div class="brand" style="margin-bottom:20px">Hepx<span>_no</span></div>
      <h1 id="authTitle">Welcome back!</h1>
      <p id="authSubtitle" class="muted">Sign in to order your favourite meals.</p>

      <form id="authForm">
        <div id="nameField" class="field hidden">
          <label for="fullName">Full name</label>
          <input id="fullName" autocomplete="name" placeholder="Enter your full name">
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" inputmode="tel"
            autocomplete="tel" placeholder="e.g. 08012345678" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password"
            minlength="6" placeholder="At least 6 characters" required>
        </div>
        <div id="confirmField" class="field hidden">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password"
            minlength="6" placeholder="Enter password again">
        </div>
        <button class="primary" id="authSubmit" type="submit">Sign In</button>
      </form>

      <div style="text-align:right;margin-top:14px">
        <button class="link-btn" id="forgotBtn">Forgot password?</button>
      </div>
      <div class="auth-switch">
        <span id="switchText">Don't have an account?</span>
        <button class="link-btn" id="switchAuth">Create account</button>
      </div>
      <p class="muted small" style="text-align:center;margin-top:28px">
        By continuing, you agree to our terms and privacy policy.
      </p>
    </div>
  </section>

  <!-- MAIN APP -->
  <section id="mainScreen" class="screen hidden">
    <header class="topbar">
      <div>
        <div class="brand"><div class="logo">H</div>
          <div>Hepx<span>_no</span>
            <div class="location">📍 Ibadan, Oyo State</div>
          </div>
        </div>
      </div>
      <button class="icon-btn" id="headerCart" aria-label="Open cart">
        🛍️ <span class="cart-count" id="cartCount">0</span>
      </button>
    </header>

    <main id="pageContent" class="page"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-page="home">
        <span class="nav-icon">⌂</span>Home
      </button>
      <button class="nav-btn" data-page="search">
        <span class="nav-icon">⌕</span>Search
      </button>
      <button class="nav-btn" data-page="orders">
        <span class="nav-icon">▤</span>Orders
      </button>
      <button class="nav-btn" data-page="cart">
        <span class="nav-icon">🛍</span>Cart
      </button>
      <button class="nav-btn" data-page="profile">
        <span class="nav-icon">♙</span>Profile
      </button>
    </nav>
  </section>

  <div id="toast" class="toast hidden"></div>
</div>

<script>
"use strict";

/*
 * HEPX_NO CUSTOMER APP
 * Frontend prototype only.
 *
 * Production needs a secure backend for accounts, menu,
 * orders, payment verification and password recovery.
 * Never use localStorage passwords for a real launch.
 */

const $ = id => document.getElementById(id);

const STORAGE = {
  users: "hepx_no_users_v1",
  session: "hepx_no_session_v1",
  orders: "hepx_no_orders_v1",
  cart: "hepx_no_cart_v1"
};

function read(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}
function write(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

let users = read(STORAGE.users, []);
let orders = read(STORAGE.orders, []);
let cart = read(STORAGE.cart, []);
let currentUser = null;
let currentPage = "home";
let authMode = "login";
let selectedCategory = "All";
let searchText = "";
let checkoutMethod = "Pay on delivery";

/*
 * Temporary menu items for UI testing.
 * Replace this sample menu with items supplied by your
 * restaurant's admin/backend before production.
 */
const menu = [
  {id:1, name:"Amala & Ewedu", category:"Amala",
   price:2500, emoji:"🍲", desc:"Traditional Nigerian favourite", tag:"Popular"},
  {id:2, name:"Amala & Gbegiri", category:"Amala",
   price:2800, emoji:"🥘", desc:"Rich, delicious local soup", tag:"Popular"},
  {id:3, name:"Amala Special", category:"Amala",
   price:3500, emoji:"🍛", desc:"A satisfying local meal", tag:"Special"},
  {id:4, name:"Efo Riro", category:"Soups",
   price:3000, emoji:"🥬", desc:"Rich Nigerian vegetable soup", tag:"Fresh"},
  {id:5, name:"Egusi Soup", category:"Soups",
   price:3000, emoji:"🍲", desc:"Classic melon seed soup", tag:"Popular"},
  {id:6, name:"Jollof Rice", category:"Rice",
   price:2500, emoji:"🍚", desc:"Smoky Nigerian-style rice", tag:"Favourite"},
  {id:7, name:"Fried Rice", category:"Rice",
   price:3000, emoji:"🍛", desc:"Rice with mixed vegetables", tag:"Fresh"},
  {id:8, name:"Pounded Yam & Soup", category:"Edo",
   price:3500, emoji:"🥣", desc:"A hearty traditional meal", tag:"Special"},
  {id:9, name:"Zobo Drink", category:"Drinks",
   price:700, emoji:"🥤", desc:"Refreshing hibiscus drink", tag:"Chilled"},
  {id:10, name:"Fresh Juice", category:"Drinks",
   price:1200, emoji:"🧃", desc:"A refreshing fruit drink", tag:"Fresh"}
];

function money(amount) {
  return "₦" + Number(amount).toLocaleString("en-NG");
}
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}
function toast(message) {
  $("toast").textContent = message;
  $("toast").classList.remove("hidden");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => $("toast").classList.add("hidden"), 2600);
}
function normalPhone(phone) {
  return phone.replace(/[\s()-]/g, "");
}
function findUser(phone) {
  const normalized = normalPhone(phone);
  return users.find(u => normalPhone(u.phone) === normalized);
}
function saveCart() {
  write(STORAGE.cart, cart);
  updateCartCount();
}
function updateCartCount() {
  $("cartCount").textContent =
    cart.reduce((sum, item) => sum + item.qty, 0);
}
function itemById(id) {
  return menu.find(item => item.id === Number(id));
}
function addToCart(id) {
  const item = itemById(id);
  if (!item) return;
  const existing = cart.find(x => x.id === item.id);
  if (existing) existing.qty++;
  else cart.push({id:item.id, qty:1});
  saveCart();
  toast(item.name + " added to cart");
  if (currentPage === "cart") renderPage();
}
function changeQty(id, delta) {
  const entry = cart.find(x => x.id === Number(id));
  if (!entry) return;
  entry.qty += delta;
  cart = cart.filter(x => x.qty > 0);
  saveCart();
  renderPage();
}
function cartSubtotal() {
  return cart.reduce((sum, entry) => {
    const item = itemById(entry.id);
    return sum + (item ? item.price * entry.qty : 0);
  }, 0);
}
function deliveryFee() {
  return cart.length ? 1000 : 0;
}

function showAuth(mode) {
  authMode = mode;
  $("authScreen").classList.remove("hidden");
  $("mainScreen").classList.add("hidden");
  $("nameField").classList.toggle("hidden", mode !== "signup");
  $("confirmField").classList.toggle("hidden", mode !== "signup");
  $("forgotBtn").classList.toggle("hidden", mode !== "login");

  $("authTitle").textContent = mode === "signup"
    ? "Create your account"
    : mode === "forgot" ? "Reset password" : "Welcome back!";

  $("authSubtitle").textContent = mode === "signup"
    ? "Join Hepx_no and order your favourite meals."
    : mode === "forgot"
      ? "Enter your registered phone number."
      : "Sign in to order your favourite meals.";

  $("authSubmit").textContent = mode === "signup"
    ? "Create Account" : mode === "forgot" ? "Continue" : "Sign In";

  $("switchText").textContent = mode === "signup"
    ? "Already have an account?"
    : mode === "forgot" ? "Remembered your password?"
    : "Don't have an account?";

  $("switchAuth").textContent =
    mode === "signup" || mode === "forgot" ? "Sign In" : "Create account";

  $("password").classList.toggle("hidden", mode === "forgot");
  $("password").required = mode !== "forgot";
  $("confirmPassword").required = mode === "signup";
  $("fullName").required = mode === "signup";
}

function enterApp(user) {
  currentUser = user;
  write(STORAGE.session, user.phone);
  $("authScreen").classList.add("hidden");
  $("mainScreen").classList.remove("hidden");
  currentPage = "home";
  renderPage();
}

$("switchAuth").addEventListener("click", () => {
  showAuth(authMode === "signup" ? "login" : "signup");
});

$("forgotBtn").addEventListener("click", () => {
  showAuth("forgot");
});

$("authForm").addEventListener("submit", event => {
  event.preventDefault();

  const phone = normalPhone($("phone").value.trim());
  const password = $("password").value;
  const name = $("fullName").value.trim();

  if (phone.length < 7 || phone.length > 16) {
    toast("Please enter a valid phone number.");
    return;
  }

  if (authMode === "signup") {
    if (name.length < 2) {
      toast("Please enter your full name.");
      return;
    }
    if (password.length < 6) {
      toast("Password must contain at least 6 characters.");
      return;
    }
    if (password !== $("confirmPassword").value) {
      toast("Passwords do not match.");
      return;
    }
    if (findUser(phone)) {
      toast("This phone number already has an account.");
      return;
    }

    // Prototype only: production passwords must be securely
    // processed and stored by a backend authentication service.
    const user = {name, phone, password};
    users.push(user);
    write(STORAGE.users, users);
    toast("Account created successfully!");
    enterApp(user);
    return;
  }

  if (authMode === "forgot") {
    const user = findUser(phone);
    if (!user) {
      toast("No account found with that phone number.");
      return;
    }
    toast("Password recovery needs a secure server or verified OTP.");
    return;
  }

  const user = findUser(phone);
  if (!user || user.password !== password) {
    toast("Incorrect phone number or password.");
    return;
  }

  enterApp(user);
});

$("bottomNav").addEventListener("click", event => {
  const btn = event.target.closest("[data-page]");
  if (!btn) return;
  currentPage = btn.dataset.page;
  if (currentPage === "search") searchText = "";
  renderPage();
});
$("headerCart").addEventListener("click", () => {
  currentPage = "cart";
  renderPage();
});

function foodCard(item) {
  return `
    <article class="food-card">
      <div class="food-image">
        <span class="tag">${escapeHTML(item.tag)}</span>
        ${item.emoji}
      </div>
      <div class="food-info">
        <h3>${escapeHTML(item.name)}</h3>
        <div class="food-desc">${escapeHTML(item.desc)}</div>
        <div class="food-bottom">
          <span class="price">${money(item.price)}</span>
          <button class="add-btn" data-add="${item.id}"
            aria-label="Add ${escapeHTML(item.name)} to cart">+</button>
        </div>
      </div>
    </article>`;
}

function filteredMenu() {
  return menu.filter(item => {
    const matchesCategory = selectedCategory === "All" ||
      item.category === selectedCategory;
    const query = searchText.toLowerCase();
    const matchesSearch = !query ||
      (item.name + " " + item.category + " " + item.desc)
      .toLowerCase().includes(query);
    return matchesCategory && matchesSearch;
  });
}

function homePage() {
  const categories = ["All","Amala","Soups","Edo","Rice","Drinks"];
  return `
    <div>
      <div style="margin-top:2px">
        <div class="muted">Hello, ${escapeHTML(currentUser.name.split(" ")[0])} 👋</div>
        <h1 style="margin-top:7px">What would you like<br>to eat today?</h1>
      </div>

      <div class="search">
        <input id="foodSearch" placeholder="Search for your favourite food..."
          value="${escapeHTML(searchText)}">
        <button id="searchButton" aria-label="Search">⌕</button>
      </div>

      <div class="banner">
        <div>
          <h2>Good food.<br>Good mood.</h2>
          <p>Your next favourite meal is waiting.</p>
          <button class="pill-btn" id="bannerOrder">Order now →</button>
        </div>
        <div class="banner-art">🍲</div>
      </div>

      <div class="section-title">
        <h2>Categories</h2>
      </div>
      <div class="categories">
        ${categories.map(c => `
          <button class="category ${selectedCategory === c ? "active" : ""}"
            data-category="${c}">${c}</button>`).join("")}
      </div>

      <div class="section-title">
        <h2>${selectedCategory === "All" ? "Our Menu" : selectedCategory}</h2>
        <span class="muted">${filteredMenu().length} items</span>
      </div>

      <div class="food-grid" id="foodGrid">
        ${filteredMenu().map(foodCard).join("") ||
          `<div class="panel" style="grid-column:1/-1;text-align:center">
            No food found. Try another search.
          </div>`}
      </div>
      <p class="muted small" style="margin-top:22px">
        Menu shown here is sample content. Connect your restaurant dashboard
        to load the actual menu and prices.
      </p>
    </div>`;
}

function searchPage() {
  return `
    <h1>Find your food 🔎</h1>
    <p class="muted">Search meals available from Hepx_no.</p>
    <div class="search">
      <input id="foodSearch" placeholder="Search meals..."
        value="${escapeHTML(searchText)}" autofocus>
      <button id="searchButton">⌕</button>
    </div>
    <div class="food-grid" id="foodGrid">
      ${filteredMenu().map(foodCard).join("") ||
        `<p class="muted">No matching meals found.</p>`}
    </div>`;
}

function cartPage() {
  if (!cart.length) {
    return `
      <div class="empty">
        <div class="empty-icon">🛍️</div>
        <h2>Your cart is empty</h2>
        <p class="muted">Your next delicious meal is one tap away.</p>
        <button class="primary" id="browseFood" style="margin-top:15px">
          Explore Menu
        </button>
      </div>`;
  }

  return `
    <h1>My Cart 🛍️</h1>
    <p class="muted">Review your order before checkout.</p>
    <div class="panel" style="margin-top:20px">
      ${cart.map(entry => {
        const item = itemById(entry.id);
        if (!item) return "";
        return `
          <div class="cart-item">
            <div class="cart-emoji">${item.emoji}</div>
            <div class="cart-item-info">
              <h3>${escapeHTML(item.name)}</h3>
              <span class="price">${money(item.price)}</span>
              <div class="qty">
                <button data-qty="${item.id}" data-delta="-1">−</button>
                <span>${entry.qty}</span>
                <button data-qty="${item.id}" data-delta="1">+</button>
              </div>
            </div>
            <strong>${money(item.price * entry.qty)}</strong>
          </div>`;
      }).join("")}
    </div>
    <div class="panel">
      <h3>Order Summary</h3>
      <div class="total-line"><span>Subtotal</span>
        <span>${money(cartSubtotal())}</span></div>
      <div class="total-line"><span>Delivery fee</span>
        <span>${money(deliveryFee())}</span></div>
      <hr class="divider">
      <div class="total-line final"><span>Total</span>
        <span>${money(cartSubtotal() + deliveryFee())}</span></div>
      <button class="primary" id="checkoutBtn">Proceed to Checkout →</button>
    </div>`;
}

function checkoutPage() {
  if (!cart.length) return cartPage();
  return `
    <h1>Checkout</h1>
    <p class="muted">Enter where you want your order delivered.</p>
    <form id="checkoutForm" class="panel" style="margin-top:20px">
      <div class="field">
        <label for="deliveryName">Recipient name</label>
        <input id="deliveryName" value="${escapeHTML(currentUser.name)}" required>
      </div>
      <div class="field">
        <label for="deliveryPhone">Phone number</label>
        <input id="deliveryPhone" type="tel"
          value="${escapeHTML(currentUser.phone)}" required>
      </div>
      <div class="field">
        <label for="deliveryAddress">Full delivery address</label>
        <input id="deliveryAddress" placeholder="Street, area, Ibadan"
          required>
      </div>
      <div class="field">
        <label for="paymentMethod">Payment method</label>
        <select id="paymentMethod">
          <option>Pay on delivery</option>
          <option>Online payment (not connected)</option>
        </select>
      </div>
      <div class="notice">
        Online payment is not connected yet. Do not enter card details here.
      </div>
      <hr class="divider">
      <div class="total-line"><span>Food subtotal</span>
        <span>${money(cartSubtotal())}</span></div>
      <div class="total-line"><span>Delivery</span>
        <span>${money(deliveryFee())}</span></div>
      <div class="total-line final"><span>Total</span>
        <span>${money(cartSubtotal()+deliveryFee())}</span></div>
      <button class="primary" type="submit">Place Order</button>
    </form>
    <button class="secondary" id="backToCart">← Back to cart</button>`;
}

function ordersPage() {
  const mine = orders.filter(o => o.phone === currentUser.phone).reverse();
  if (!mine.length) {
    return `
      <div class="empty">
        <div class="empty-icon">📦</div>
        <h2>No orders yet</h2>
        <p class="muted">Your orders will appear here when you place them.</p>
        <button class="primary" id="browseFood">Explore Menu</button>
      </div>`;
  }
  return `
    <h1>My Orders</h1>
    <p class="muted">Your previous and current orders.</p>
    <div style="margin-top:20px">
      ${mine.map(order => `
        <div class="panel">
          <div class="row">
            <div>
              <h3>Order #${escapeHTML(order.id)}</h3>
              <p class="muted">${escapeHTML(order.date)}</p>
            </div>
            <span class="status">${escapeHTML(order.status)}</span>
          </div>
          <hr class="divider">
          <p class="muted">${order.items.map(i =>
            escapeHTML(i.name) + " × " + i.qty).join(", ")}</p>
          <div class="row">
            <strong>${money(order.total)}</strong>
            <button class="text-btn" data-track="${escapeHTML(order.id)}">
              Track order →
            </button>
          </div>
        </div>`).join("")}
    </div>`;
}

function trackingPage(id) {
  const order = orders.find(o =>
    String(o.id) === String(id) && o.phone === currentUser.phone);
  if (!order) return "<h1>Order not found</h1>";
  const steps = ["Order placed","Preparing","On the way","Delivered"];
  const active = steps.indexOf(order.status);
  return `
    <h1>Track Order</h1>
    <p class="muted">Order #${escapeHTML(order.id)}</p>
    <div class="panel" style="margin-top:20px">
      <div style="font-size:54px;text-align:center;padding:15px">🛵</div>
      <h2 style="text-align:center">${escapeHTML(order.status)}</h2>
      <p class="muted" style="text-align:center">
        Your order status will update when the restaurant updates it.
      </p>
      <hr class="divider">
      ${steps.map((step, i) => `
        <div class="row" style="padding:12px 0">
          <div style="display:flex;gap:12px;align-items:center">
            <div style="width:30px;height:30px;border-radius:50%;
              background:${i <= active ? "var(--orange)" : "#eee"};
              color:${i <= active ? "white" : "#888"};
              display:grid;place-items:center">${i <= active ? "✓" : i+1}</div>
            <span>${step}</span>
          </div>
        </div>`).join("")}
    </div>
    <button class="secondary" id="backOrders">← Back to orders</button>`;
}

function profilePage() {
  return `
    <h1>My Profile</h1>
    <p class="muted">Manage your account and preferences.</p>
    <div class="profile-head">
      <div class="avatar">${escapeHTML(currentUser.name.charAt(0).toUpperCase())}</div>
      <div>
        <h2>${escapeHTML(currentUser.name)}</h2>
        <p class="muted">${escapeHTML(currentUser.phone)}</p>
      </div>
    </div>
    <div class="panel">
      <button class="menu-row" data-action="edit">
        <span class="menu-icon">👤</span>
        <span>Edit profile<small class="muted" style="display:block;margin-top:5px">Update your name</small></span>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-row" data-action="orders">
        <span class="menu-icon">📦</span>
        <span>My orders<small class="muted" style="display:block;margin-top:5px">View order history</small></span>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-row" data-action="address">
        <span class="menu-icon">📍</span>
        <span>Delivery address<small class="muted" style="display:block;margin-top:5px">Set an address for checkout</small></span>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-row" data-action="password">
        <span class="menu-icon">🔒</span>
        <span>Change password<small class="muted" style="display:block;margin-top:5px">Manage sign-in details</small></span>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-row" data-action="help">
        <span class="menu-icon">💬</span>
        <span>Help & support</span>
        <span class="menu-arrow">›</span>
      </button>
    </div>
    <button class="secondary" id="logoutBtn" style="color:#d9363e">
      Log Out
    </button>
    <p class="muted small" style="text-align:center;margin-top:22px">
      Hepx_no · Food delivery
    </p>`;
}

function renderPage() {
  if (!currentUser) return showAuth("login");

  $("authScreen").classList.add("hidden");
  $("mainScreen").classList.remove("hidden");
  $("bottomNav").classList.remove("hidden");

  const content = $("pageContent");
  if (currentPage === "home") content.innerHTML = homePage();
  else if (currentPage === "search") content.innerHTML = searchPage();
  else if (currentPage === "cart") content.innerHTML = cartPage();
  else if (currentPage === "checkout") content.innerHTML = checkoutPage();
  else if (currentPage === "orders") content.innerHTML = ordersPage();
  else if (currentPage === "tracking") {
    content.innerHTML = trackingPage(window.currentTrackingId);
  }
  else if (currentPage === "profile") content.innerHTML = profilePage();

  $("bottomNav").classList.toggle("hidden",
    currentPage === "checkout" || currentPage === "tracking");

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === currentPage);
  });

  updateCartCount();
  content.scrollTop = 0;
}

$("pageContent").addEventListener("click", event => {
  const add = event.target.closest("[data-add]");
  if (add) return addToCart(add.dataset.add);

  const category = event.target.closest("[data-category]");
  if (category) {
    selectedCategory = category.dataset.category;
    currentPage = currentPage === "search" ? "search" : "home";
    return renderPage();
  }

  const qty = event.target.closest("[data-qty]");
  if (qty) return changeQty(qty.dataset.qty, Number(qty.dataset.delta));

  const track = event.target.closest("[data-track]");
  if (track) {
    window.currentTrackingId = track.dataset.track;
    currentPage = "tracking";
    return renderPage();
  }

  const action = event.target.closest("[data-action]");
  if (action) return profileAction(action.dataset.action);

  if (event.target.closest("#bannerOrder") ||
      event.target.closest("#browseFood")) {
    currentPage = "home";
    return renderPage();
  }
  if (event.target.closest("#checkoutBtn")) {
    currentPage = "checkout";
    return renderPage();
  }
  if (event.target.closest("#backToCart")) {
    currentPage = "cart";
    return renderPage();
  }
  if (event.target.closest("#backOrders")) {
    currentPage = "orders";
    return renderPage();
  }
  if (event.target.closest("#logoutBtn")) {
    currentUser = null;
    localStorage.removeItem(STORAGE.session);
    cart = [];
    saveCart();
    $("authForm").reset();
    showAuth("login");
    return;
  }
});

$("pageContent").addEventListener("input", event => {
  if (event.target.id === "foodSearch") {
    searchText = event.target.value;
    const grid = $("foodGrid");
    if (grid) grid.innerHTML =
      filteredMenu().map(foodCard).join("") ||
      `<p class="muted">No matching meals found.</p>`;
  }
});

$("pageContent").addEventListener("click", event => {
  if (event.target.closest("#searchButton")) {
    searchText = $("foodSearch")?.value || "";
    currentPage = "search";
    renderPage();
  }
});

$("pageContent").addEventListener("submit", event => {
  if (event.target.id === "checkoutForm") {
    event.preventDefault();
    placeOrder();
  }
});

function placeOrder() {
  const name = $("deliveryName").value.trim();
  const phone = normalPhone($("deliveryPhone").value.trim());
  const address = $("deliveryAddress").value.trim();
  const method = $("paymentMethod").value;

  if (!name || phone.length < 7 || !address) {
    toast("Please complete your delivery details.");
    return;
  }
  if (method !== "Pay on delivery") {
    toast("Online payment is not connected yet.");
    return;
  }
  if (!cart.length) {
    toast("Your cart is empty.");
    currentPage = "cart";
    return renderPage();
  }

  const order = {
    id: Date.now().toString().slice(-8),
    phone: currentUser.phone,
    customerName: name,
    deliveryPhone: phone,
    address,
    paymentMethod: method,
    items: cart.map(entry => {
      const item = itemById(entry.id);
      return {id:item.id, name:item.name, price:item.price, qty:entry.qty};
    }),
    subtotal: cartSubtotal(),
    deliveryFee: deliveryFee(),
    total: cartSubtotal() + deliveryFee(),
    status: "Order placed",
    date: new Date().toLocaleString()
  };

  orders.push(order);
  write(STORAGE.orders, orders);
  cart = [];
  saveCart();
  toast("Order saved on this device!");
  window.currentTrackingId = order.id;
  currentPage = "tracking";
  renderPage();
}

function profileAction(action) {
  if (action === "orders") {
    currentPage = "orders";
    return renderPage();
  }
  if (action === "edit") {
    const name = prompt("Enter your new full name:", currentUser.name);
    if (!name || name.trim().length < 2) return;
    currentUser.name = name.trim();
    users = users.map(u => u.phone === currentUser.phone ? currentUser : u);
    write(STORAGE.users, users);
    toast("Profile updated on this device.");
    return renderPage();
  }
  if (action === "address") {
    const address = prompt("Enter your delivery address:");
    if (!address || !address.trim()) return;
    currentUser.address = address.trim();
    users = users.map(u => u.phone === currentUser.phone ? currentUser : u);
    write(STORAGE.users, users);
    toast("Address saved on this device.");
    return;
  }
  if (action === "password") {
    const oldPassword = prompt("Enter your current password:");
    if (oldPassword === null) return;
    if (oldPassword !== currentUser.password) {
      toast("Current password is incorrect.");
      return;
    }
    const next = prompt("Enter a new password (at least 6 characters):");
    if (!next || next.length < 6) {
      toast("Password must contain at least 6 characters.");
      return;
    }
    currentUser.password = next;
    users = users.map(u => u.phone === currentUser.phone ? currentUser : u);
    write(STORAGE.users, users);
    toast("Password changed on this device.");
    return;
  }
  if (action === "help") {
    alert("Hepx_no Support\n\nPlease connect your official customer support phone or email before launching.");
  }
}

// Restore an existing local prototype session.
(function init() {
  updateCartCount();
  const savedPhone = read(STORAGE.session, null);
  if (savedPhone) {
    const user = findUser(savedPhone);
    if (user) {
      currentUser = user;
      $("authScreen").classList.add("hidden");
      $("mainScreen").classList.remove("hidden");
      renderPage();
      return;
    }
  }
  showAuth("login");
})();
</script>
</body>
</html>
